name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable exe
        run: npm run dist

      - name: Rename portable exe to ASCII
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $exe = Get-ChildItem -Path release -Filter '*.exe' -File | Select-Object -First 1
          if (-not $exe) { throw 'electron-builder did not produce a portable exe' }

          $dest = "release/NiuMa-Encourager-$version.exe"
          Move-Item -Path $exe.FullName -Destination $dest -Force

          Add-Content -Path $env:GITHUB_OUTPUT -Value "asset_path=$dest"
          Write-Host "Prepared $dest"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NiuMa-Encourager-portable
          path: ${{ steps.package.outputs.asset_path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.package.outputs.asset_path }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          Write-Host "Publishing release $tag with $env:ASSET_PATH"

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists, replacing asset"
            gh release upload $tag $env:ASSET_PATH --clobber
          } else {
            gh release create $tag $env:ASSET_PATH `
              --title "牛马鼓励器 $tag" `
              --generate-notes
          }
